{% extends "base.html" %}

{% block title %}Reset Password Baru - Koperasi Core{% endblock %}

{% block guest_content %}
<div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-md);">
  <div style="text-align: center; margin-bottom: 24px;">
    <h1 style="font-size: 1.5rem; color: var(--gray-900);">🔑 Buat Password Baru</h1>
    <p class="text-muted" style="margin-top: 4px;">Silakan tentukan password baru yang aman untuk akun Anda.</p>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">

    <div class="form-group">
      <label class="form-label" for="password">Password Baru</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 8 karakter" required minlength="8" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Konfirmasi Password Baru</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Ketik ulang password baru" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">
      Simpan Password & Masuk
    </button>
  </form>
</div>
{% endblock %}
