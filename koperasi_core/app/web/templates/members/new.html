{% extends "base.html" %}

{% block title %}Pendaftaran Anggota Baru - Koperasi Core{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <div>
    <h1>➕ Pendaftaran Anggota Baru Manual</h1>
    <p class="text-muted">Daftarkan anggota secara individual. Rekening simpanan akan dibuat otomatis.</p>
  </div>
  <div>
    <a href="/members" class="btn btn-secondary btn-sm">← Kembali ke Daftar</a>
  </div>
</div>

<div class="card" style="max-width: 800px;">
  <form method="POST" action="/members/new">
    <div class="grid grid-cols-2">
      <div class="form-group">
        <label class="form-label" for="member_number">Nomor Anggota (Wajib, Unik) *</label>
        <input type="text" id="member_number" name="member_number" class="form-control" placeholder="cth: MEM-099" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Nama Lengkap Sesuai KTP *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Nama Lengkap" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="nik">NIK (16 Digit Angka) *</label>
        <input type="text" id="nik" name="nik" class="form-control" placeholder="317101..." maxlength="16" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Alamat Email *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="email@koperasi.local" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Nomor Telepon / WhatsApp</label>
        <input type="text" id="phone" name="phone" class="form-control" placeholder="08123456789">
      </div>

      <div class="form-group">
        <label class="form-label" for="bank_account">Rekening Bank (Pencairan)</label>
        <input type="text" id="bank_account" name="bank_account" class="form-control" placeholder="BCA 1234567890">
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label class="form-label" for="address">Alamat Lengkap</label>
        <textarea id="address" name="address" class="form-control" rows="2" placeholder="Alamat domisili"></textarea>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
      <a href="/members" class="btn btn-secondary">Batal</a>
      <button type="submit" class="btn btn-primary">Simpan Anggota Baru</button>
    </div>
  </form>
</div>
{% endblock %}
